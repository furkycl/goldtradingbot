# ⚠️ NOT RECOMMENDED FOR TRADING. reports/validation-2026-10-05.md: at token
# exchange fees (0.10-0.20%/side) the hourly strategy LOSES money (PF 0.90 / 0.15).
# The engine's cost guard (risk.max_cost_in_r) blocks live entries here.
# Tokenised gold is better used as an unlevered HOLDING (see docs/STRATEGY.md).
#
# Small-account profile: tokenised gold (PAXG/USDT) spot, long-only, no leverage.
# Use: cp config/profiles/small_account_paxg.yaml config/settings.yaml
# Before going live, verify the exchange is on SPK's crypto-asset provider list
# and check its real fees.
# Findings 2026-10-04 (docs/RESEARCH.md §2): BtcTurk (ccxt "btcturk") lists NO
# PAXG/XAUT pair; Paribu lists XAUT/TL but has no ccxt module (needs a custom
# client). Re-check listings before using this profile live.

mode: paper
broker: ccxt
symbol: PAXGUSDT
starting_equity: 100
long_only: true

commission_per_lot: 8.0   # ~0.1% per side x 2 on a ~$4,000 token; adjust to the real price/fee
spread: 1.0               # USD per token, typical for PAXG books; check live
financing_pct_per_year: 0.0  # spot token: no swap
contract_size: 1          # 1 token ~ 1 troy oz
min_lot: 0.0001
lot_step: 0.0001

poll_seconds: 30
news_blackout_minutes: 30

risk:
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 20.0
  max_leverage: 1.0        # spot: no leverage
  max_open_positions: 1
  max_trades_per_day: 4

news:
  telegram:
    session: goldbot
    channels: []

broker_options:
  exchange: ""             # REQUIRED: ccxt id of an SPK-permitted exchange that lists the symbol
  symbol: PAXG/USDT
