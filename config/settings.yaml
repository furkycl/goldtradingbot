# Human-owned settings. The self-improvement loop never edits this file.

mode: paper            # paper | demo (broker demo account) | live (ALSO needs env GOLDBOT_LIVE_CONFIRM)
broker: paper          # paper | mt5 | ccxt
symbol: XAUUSD
starting_equity: 100

# cost assumptions for paper/backtest (set to your broker's real values)
commission_per_lot: 7.0   # USD round turn per 100 oz lot
spread: 0.30              # USD per oz
financing_pct_per_year: 5.0  # overnight swap on CFD notional; 0 for spot tokens
contract_size: 100        # oz per lot (MT5/ccxt adapters overwrite from the broker)
min_lot: 0.01
lot_step: 0.01

poll_seconds: 30
news_blackout_minutes: 30

risk:
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 20.0
  max_leverage: 10.0       # SPK limit for Turkish residents; capped at 10 in code
  max_open_positions: 1    # >1 = one position per strategy family, never opposite directions
  max_total_risk_pct: 2.0  # sum of open initial risk, % of equity (only matters when >1 position)
  max_trades_per_day: 4
  max_cost_in_r: 0.05     # refuse live/demo entries on venues that are too expensive
  # --- equity ladder (your plan: higher risk while small, cap the levered pot later) ---
  # trading_cap: equity above this is never risked by the bot; it notifies you to
  # sweep the excess to an unlevered core (gram gold / token). 0 = off.
  trading_cap: 0
  # risk_ladder: risk per trade by account size, [[equity_from, risk_pct], ...].
  # Hard ceiling in code: 3%. Example: [[0, 2.0], [1000, 1.0], [5000, 0.5]]
  risk_ladder: []
  sweep_min: 50

news:
  # verified working 2026-10-04; run `python -m goldbot probe-feeds` to re-check
  rss:
    - https://www.financialjuice.com/feed.ashx?xy=rss
    - https://investinglive.com/feed/news
    - https://www.investing.com/rss/news_95.rss
    - https://www.fxstreet.com/rss/news
    - https://www.investing.com/rss/news_11.rss
    - https://www.federalreserve.gov/feeds/press_monetary.xml
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://www.ecb.europa.eu/rss/press.html
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
    - https://www.bloomberght.com/rss
  telegram:
    session: goldbot
    # wire-style headline channels (checked 2026-10-04). Not used unless
    # TELEGRAM_API_ID/HASH are set. Avoid "signal"/"VIP" channels.
    channels:
      - WalterBloomberg
      - financialjuice
      - BreakingMarketNews
      - disclosetv

broker_options:
  symbol: XAUUSD           # MT5 symbol name at your broker (e.g. XAUUSD, GOLD) or PAXG/USDT for ccxt
  magic: 770077
