name: Validate

# Statistical validation on real data (edge vs random, cost stress, parameter
# neighbourhood, daily trend 2000-2026, Monte Carlo). Monthly + on demand.
# Only reports/ may change.

on:
  schedule:
    - cron: "23 5 2 * *"   # 2nd of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Validate on real data
        run: python scripts/validate.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish_auto.sh "strategy validation report" auto/validate
