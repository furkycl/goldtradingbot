name: Validate

# Statistical validation on real data (edge vs random, cost stress, parameter
# neighbourhood, daily trend 2000-2026, Monte Carlo). Monthly + on demand.
# Only reports/ may change.

on:
  schedule:
    - cron: "23 5 2 * *"   # 2nd of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Validate on real data
        run: python scripts/validate.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A reports/
          python scripts/check_auto_diff.py HEAD --staged
          if git diff --cached --quiet; then echo "no report changes"; exit 0; fi
          BR="auto/validate-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "goldbot-validate"
          git config user.email "goldbot-validate@users.noreply.github.com"
          git checkout -b "$BR"
          git commit -m "auto: strategy validation report ($(date -u +%F))"
          git push -u origin "$BR"
          if gh pr create --base main --head "$BR" --title "auto: validation $(date -u +%F)" --body "Reports only."; then
            gh pr merge "$BR" --squash --delete-branch
          else
            git fetch origin main && git rebase origin/main
            git push origin "HEAD:main"
            git push origin --delete "$BR"
          fi
