name: Research

# Monthly (and on demand): backtest research-backed strategy variants on real
# data under 1x and 2x costs, and publish the comparison to reports/.
# Only reports/ may change (enforced by check_auto_diff.py).

on:
  schedule:
    - cron: "41 4 1 * *"   # 1st of each month, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Probe news feeds from a real host
        run: |
          mkdir -p reports
          python -m goldbot probe-feeds | tee "reports/feeds-$(date -u +%F).txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare variants on real data
        run: python scripts/compare_variants.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare strategy families and ensembles on real data
        run: python scripts/compare_strategies.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish_auto.sh "research reports" auto/research
