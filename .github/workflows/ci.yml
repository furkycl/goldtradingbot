name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - run: pytest -q
      - name: Backtest smoke test (synthetic data)
        run: python -m goldbot backtest --equity 10000
      - name: Auto branches may only change params and reports
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'auto/')
        run: python scripts/check_auto_diff.py origin/${{ github.base_ref }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t goldbot:ci .
      - name: Smoke test image
        run: |
          docker run --rm goldbot:ci --help
          docker run --rm goldbot:ci backtest --equity 10000
          # root-owned bind mount (what `docker compose up` creates) must still be writable
          mkdir -p /tmp/st && sudo chown root:root /tmp/st
          docker run --rm -v /tmp/st:/app/state goldbot:ci reset-halt
          test -f /tmp/st/paper/risk.json && echo "state volume writable"
