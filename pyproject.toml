[project]
name = "goldbot"
version = "0.3.0"
description = "Risk-first, news-aware XAU/USD trading bot (paper/demo by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26", "pyyaml>=6.0", "requests>=2.31", "feedparser>=6.0", "yfinance>=0.2.40"]

[project.optional-dependencies]
telegram = ["telethon>=1.36"]
mt5 = ["MetaTrader5>=5.0.45"]
crypto = ["ccxt>=4.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
goldbot = "goldbot.cli:main"

[tool.setuptools]
packages = ["goldbot", "goldbot.news", "goldbot.brokers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E701", "E702", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
# HTML / markdown report templates are clearer on one line
"goldbot/forward.py" = ["E501"]
"scripts/validate.py" = ["E501"]
"scripts/compare_strategies.py" = ["E501"]
